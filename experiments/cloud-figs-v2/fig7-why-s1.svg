text x="692.0" y="414.0" font-size="12" fill="#333">이득은 ×2.54로 크지만</text><text x="692.0" y="435.0" font-size="12" fill="#333">Fabric 실패 77~86%, 성공 138/s.</text><text x="692.0" y="456.0" font-size="12" fill="#333">무너진 기준과 비교한 이득이라</text><text x="692.0" y="477.0" font-size="12" fill="#333">대표값으로 쓰면 과장이 된다.</text><text x="692.0" y="498.0" font-size="12" fill="#666">(그래도 곡선의 끝점으로는 보인다)</text><text x="430.0" y="746.0" text-anchor="middle" fill="#555" font-size="11">smallbank, 1,000 TPS, Query 50%, 사용자 5명, 긴급 0 · AWS 4 VM · 30초(앞 5초 제외) × 3회 평균 ± 표준편차</text>
