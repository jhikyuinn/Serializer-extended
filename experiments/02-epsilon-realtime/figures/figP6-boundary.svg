" text-anchor="middle" fill="#555" font-size="11">ε 1 이 높은 TPS 에서 무너지는 이유: 더 많이 살린 tx 를 피어(16 vCPU, 2개)가 제때 커밋하지 못해 지연이 쌓이고 배치 사이 낡은 읽기가 늘어난다(§77).</text>
