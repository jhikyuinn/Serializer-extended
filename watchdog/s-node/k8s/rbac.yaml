# s-node가 활성 pod를 정하는 데 필요한 권한
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snode
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snode
rules:
  # 활성 s-node를 정하는 Lease
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # Service가 활성 pod만 고르도록 snode-role 라벨을 바꾼다
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snode
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: snode
subjects:
  - kind: ServiceAccount
    name: snode
